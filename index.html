.card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5rem;text-decoration:none;color:inherit;

footer{text-align:center;color:#94a3b8;font-size:.85rem;padding:1.5rem 0 .5rem}
.install-button{display:block;margin:0 auto 1rem;padding:.65rem 1.1rem;border:1px solid #93c5fd;border-radius:.5rem;
  background:#1e40af;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.install-button:hover,.install-button:focus-visible{background:#2563eb;outline:2px solid #bfdbfe;outline-offset:2px}
.install-button[hidden]{display:none}
.connection-status{text-align:center;color:#fde68a;font-size:.9rem;margin-top:1rem}

<button class="install-button" id="installButton" type="button" hidden>تثبيت التطبيق</button>
<p class="connection-status" id="connectionStatus" role="status" aria-live="polite" hidden></p>
<footer>تصميم: دراغ علي</footer>
<script>
const installButton = document.getElementById('installButton');
const connectionStatus = document.getElementById('connectionStatus');
let installPrompt;

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  installPrompt = event;
  installButton.hidden = false;
});

installButton.addEventListener('click', async () => {
  if (!installPrompt) return;
  await installPrompt.prompt();
  installPrompt = null;
  installButton.hidden = true;
});

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  installButton.hidden = true;
});

function updateConnectionStatus() {
  connectionStatus.hidden = navigator.onLine;
  connectionStatus.textContent = navigator.onLine
    ? ''
    : 'أنت غير متصل. صفحة البداية محفوظة، أما الجداول فتحتاج إلى اتصال بالخادم.';
}

window.addEventListener('online', updateConnectionStatus);
window.addEventListener('offline', updateConnectionStatus);
updateConnectionStatus();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((error) => {
      console.error('تعذر تسجيل Service Worker:', error);
    });
  });
}
</script>
